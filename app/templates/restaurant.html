{% extends "base.html" %}


{% block title %}
{{name}} - Inspection History
{% endblock %}


{% block content %}


<h1>
    {{name}}
</h1>


<div class="card">

    <h2>
        Inspection History
    </h2>


    <table>

        <tr>
            <th>Date</th>
            <th>Score</th>
            <th>Grade</th>
            <th>Source</th>
            <th>Inspector</th>
        </tr>


        {% for row in history %}

        <tr>

            <td>
                {{row[1]}}
            </td>

            <td>
                {{row[2]}}
            </td>


            <td>
                <span class="grade">
                    {{row[3]}}
                </span>
            </td>

            <td>
                {{row[4]}}
            </td>


            <td>
                <a href="/inspector?inspector_id={{row[5]}}">
                    {{row[5]}}
                </a>
            </td>


        </tr>


        {% endfor %}


    </table>


</div>
<div class="chart-card">
    <canvas id="scoreChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    const grades = [
        {% for row in history %}
    "{{row[3]}}",
        {% endfor %}
];


    const dates = [
        {% for row in history %}
    "{{row[1]}}",
        {% endfor %}
];


    const scores = [
        {% for row in history %}
    { { row[2] } },
    {% endfor %}
];


    new Chart(
        document.getElementById('scoreChart'),
        {
            type: 'line',

            data: {
                labels: dates,

                datasets: [
                    {
                        label: 'Inspection Score',
                        data: scores,
                        borderColor: '#4cafef',
                        tension: 0.3
                    }
                ]
            },

            options: {
                responsive: true
            }
        }
    );

</script>


{% endblock %}
